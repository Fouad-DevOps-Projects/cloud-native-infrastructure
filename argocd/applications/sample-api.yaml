apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fouad-DevOps-Projects/cloud-native-infrastructure.git
    targetRevision: main
    path: helm/sample-api
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        image:
          tag: sha-192f294e480e7721b7f188892e94d40deccd2c1c
        imagePullSecrets:
          - name: ghcr-pull
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
