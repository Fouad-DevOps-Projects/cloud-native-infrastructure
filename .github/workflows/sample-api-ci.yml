name: Sample API CI and Image Publishing
on:
  push:
    branches: [main]
    paths:
      - 'apps/sample-api/**'
      - 'helm/sample-api/**'
      - '.github/workflows/sample-api-ci.yml'
  pull_request:
    paths:
      - 'apps/sample-api/**'
      - 'helm/sample-api/**'
      - '.github/workflows/sample-api-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sample-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/sample-api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.4
      - run: helm lint helm/sample-api
      - run: helm template sample-api helm/sample-api > /tmp/sample-api-rendered.yaml

  image:
    runs-on: ubuntu-latest
    needs: [test, helm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: apps/sample-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/sample-api:latest
            ghcr.io/${{ github.repository }}/sample-api:sha-${{ github.sha }}
