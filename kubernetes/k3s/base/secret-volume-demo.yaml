apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-volume-demo
  labels:
    app: secret-volume-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-volume-demo
  template:
    metadata:
      labels:
        app: secret-volume-demo
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              if [ -s /etc/app-secrets/DB_PASSWORD ]; then
                echo "Secret file is mounted and non-empty"
              else
                echo "Secret file is missing or empty"
                exit 1
              fi
              sleep 3600
          volumeMounts:
            - name: secret-volume
              mountPath: /etc/app-secrets
              readOnly: true
      volumes:
        - name: secret-volume
          secret:
            secretName: app-secret
