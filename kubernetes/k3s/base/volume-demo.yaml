apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-demo
  labels:
    app: volume-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volume-demo
  template:
    metadata:
      labels:
        app: volume-demo
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              cat /etc/app-config/APP_ENV
              cat /etc/app-config/LOG_LEVEL
              sleep 3600
          volumeMounts:
            - name: app-config-volume
              mountPath: /etc/app-config
              readOnly: true
      volumes:
        - name: app-config-volume
          configMap:
            name: app-config
