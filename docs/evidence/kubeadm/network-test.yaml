apiVersion: v1
kind: Namespace
metadata:
  name: network-test
---
apiVersion: v1
kind: Pod
metadata:
  name: web-server
  namespace: network-test
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-2
  containers:
  - name: nginx
    image: nginx:stable-alpine
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: network-test
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-1
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
